<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticky Task Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

 <section id="authSection" class="auth-box">
  <div class="auth-card">
    <p class="eyebrow">Welcome Back</p>
    <h2>Login to Sticky Task Board</h2>
    <p class="auth-subtitle">Save your notes and access them anytime.</p>

    <input type="email" id="emailInput" placeholder="Enter your email" />
    <input type="password" id="passwordInput" placeholder="Enter your password" />

    <div class="auth-actions">
      <button id="loginBtn" type="button">Login</button>
      <button id="signupBtn" type="button">Sign Up</button>
    </div>

    <p id="authMessage"></p>
  </div>
</section>
 <main class="app hidden" id="appSection">
    <section class="hero">
      <p class="eyebrow">Creative To-Do App</p>
      <h1>Sticky Task Board</h1>
      <p>Add your task and it will appear like a hand-drawn sticky paper note.</p>
      <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </section>

    <form id="taskForm" class="task-form">
      <input type="text" id="taskInput" placeholder="Write your task..." required />
      <select id="priorityInput">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="dateInput" />
      <button type="submit">Add Note</button>
    </form>

    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search notes..." />

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Done</button>
      </div>
    </div>

    <section id="taskList" class="task-board"></section>

    <div id="emptyState" class="empty-state">
      <h2>No sticky notes yet</h2>
      <p>Add your first task to start your board.</p>
    </div>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="doodles.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
