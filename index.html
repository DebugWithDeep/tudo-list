<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticky Task Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

 
  <main class="app">
    <section class="hero">
      <p class="eyebrow">Creative To-Do App</p>
      <h1>Sticky Task Board</h1>
      <p>Add your task and it will appear like a hand-drawn sticky paper note.</p>
    </section>

    <form id="taskForm" class="task-form">
      <input type="text" id="taskInput" placeholder="Write your task..." required />
      <select id="priorityInput">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="dateInput" />
      <button type="submit">Add Note</button>
    </form>

    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search notes..." />

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Done</button>
      </div>
    </div>

    <section id="taskList" class="task-board"></section>

    <div id="emptyState" class="empty-state">
      <h2>No sticky notes yet</h2>
      <p>Add your first task to start your board.</p>
    </div>
  </main>
  <script src="doodles.js"></script>
  <script src="script.js"></script>
</body>
</html>
